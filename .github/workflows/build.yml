name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Lint — no hot-path logging in generators
        working-directory: jmeter-plugin/src/main/java/com/mockjutsu/jmeter/generators
        run: |
          if grep -rn 'log\.debug\|log\.info' .; then
            echo "ERROR: log.debug / log.info found in generators/. Hot-path logging degrades throughput 10–50×. Use log.warn only on exception paths."
            exit 1
          fi
          echo "OK: no hot-path logging found in generators/"

      - name: Build & test
        working-directory: jmeter-plugin
        run: mvn -B test

      - name: Package fat JAR
        working-directory: jmeter-plugin
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mock-jutsu-jmeter-java${{ matrix.java }}
          path: jmeter-plugin/target/mock-jutsu-jmeter-*.jar
