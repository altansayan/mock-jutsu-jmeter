name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Lint — no hot-path logging in generators
        working-directory: jmeter-plugin/src/main/java/com/mockjutsu/jmeter/generators
        run: |
          if grep -rn 'log\.debug\|log\.info' .; then
            echo "ERROR: log.debug / log.info found in generators/. Hot-path logging degrades throughput 10–50×. Use log.warn only on exception paths."
            exit 1
          fi
          echo "OK: no hot-path logging found in generators/"

      - name: Build & test
        working-directory: jmeter-plugin
        run: mvn -B test

      - name: Package fat JAR
        working-directory: jmeter-plugin
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mock-jutsu-jmeter-java${{ matrix.java }}
          path: jmeter-plugin/target/mock-jutsu-jmeter-*.jar

  jmeter-smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Download plugin JAR (Java 21 build)
        uses: actions/download-artifact@v4
        with:
          name: mock-jutsu-jmeter-java21
          path: plugin-jar

      - name: Cache JMeter 5.6.3
        uses: actions/cache@v4
        id: jmeter-cache
        with:
          path: apache-jmeter-5.6.3
          key: jmeter-5.6.3

      - name: Install JMeter 5.6.3
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Install plugin into JMeter
        run: cp plugin-jar/*.jar apache-jmeter-5.6.3/lib/ext/

      - name: Run smoke test (1 thread × all types)
        run: |
          apache-jmeter-5.6.3/bin/jmeter -n \
            -t test-functions.jmx \
            -l results.jtl \
            -j jmeter-ci.log

      - name: Check for sample failures
        run: |
          python3 - <<'PYEOF'
          import csv, sys
          failures = []
          total = 0
          with open("results.jtl") as f:
              reader = csv.DictReader(f)
              for row in reader:
                  total += 1
                  if row.get("success", "true").lower() == "false":
                      failures.append(row)
          if failures:
              print(f"::error::FAILED: {len(failures)}/{total} samples failed")
              for row in failures:
                  print(f"  x {row.get('label','?')} — {row.get('failureMessage','')}")
              sys.exit(1)
          print(f"OK: all {total} samples passed")
          PYEOF

      - name: Upload JMeter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-smoke-results
          path: |
            results.jtl
            jmeter-ci.log
