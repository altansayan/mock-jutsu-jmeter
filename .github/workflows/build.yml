name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Lint — no hot-path logging in generators
        working-directory: jmeter-plugin/src/main/java/com/mockjutsu/jmeter/generators
        run: |
          if grep -rn 'log\.debug\|log\.info' .; then
            echo "ERROR: log.debug / log.info found in generators/. Hot-path logging degrades throughput 10–50×. Use log.warn only on exception paths."
            exit 1
          fi
          echo "OK: no hot-path logging found in generators/"

      - name: Build & test
        working-directory: jmeter-plugin
        run: mvn -B test

      - name: Package fat JAR
        working-directory: jmeter-plugin
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mock-jutsu-jmeter-java${{ matrix.java }}
          path: jmeter-plugin/target/mock-jutsu-jmeter-*.jar

  jmeter-smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Download plugin JAR (Java 21 build)
        uses: actions/download-artifact@v4
        with:
          name: mock-jutsu-jmeter-java21
          path: plugin-jar

      - name: Cache JMeter 5.6.3
        uses: actions/cache@v4
        id: jmeter-cache
        with:
          path: apache-jmeter-5.6.3
          key: jmeter-5.6.3

      - name: Install JMeter 5.6.3
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Install plugin into JMeter
        run: cp plugin-jar/*.jar apache-jmeter-5.6.3/lib/ext/

      - name: Run smoke test (1 thread × all types)
        run: |
          apache-jmeter-5.6.3/bin/jmeter -n \
            -t test-functions.jmx \
            -l results.jtl \
            -j jmeter-ci.log

      - name: Report & check results
        if: always()
        run: |
          python3 - <<'PYEOF'
          import csv, sys, os

          rows = []
          with open("results.jtl") as f:
              for row in csv.DictReader(f):
                  rows.append(row)

          total    = len(rows)
          failures = [r for r in rows if r.get("success", "true").lower() == "false"]
          passed   = total - len(failures)

          # ── GitHub Step Summary ────────────────────────────────────────
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary:
              with open(summary, "w") as s:
                  if failures:
                      s.write(f"## ❌ Smoke Test — {len(failures)} / {total} failed\n\n")
                      s.write("| Sample | Failure |\n|---|---|\n")
                      for r in failures:
                          s.write(f"| `{r.get('label','?')}` | {r.get('failureMessage','').strip()} |\n")
                  else:
                      s.write(f"## ✅ Smoke Test — all {total} samples passed\n\n")

                  # Top-10 slowest
                  slowest = sorted(rows, key=lambda r: int(r.get("elapsed", 0)), reverse=True)[:10]
                  s.write("\n### Slowest 10 samples (ms)\n\n")
                  s.write("| Sample | elapsed (ms) |\n|---|---|\n")
                  for r in slowest:
                      s.write(f"| `{r.get('label','?')}` | {r.get('elapsed','?')} |\n")

          # ── Console output + exit code ─────────────────────────────────
          if failures:
              print(f"::error::FAILED: {len(failures)}/{total} samples")
              for r in failures:
                  print(f"  ✗ {r.get('label','?')} — {r.get('failureMessage','').strip()}")
              sys.exit(1)
          print(f"OK: {passed}/{total} passed")
          PYEOF

      - name: Upload JMeter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-smoke-results
          path: |
            results.jtl
            jmeter-ci.log
